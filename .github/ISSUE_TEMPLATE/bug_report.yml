name: Bug Report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `docker run ...`
        2. Send request to ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Spidertrap version / image tag
      placeholder: "e.g. latest, 2.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Host OS and architecture
      placeholder: "e.g. Ubuntu 24.04, linux/arm64"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant output from `docker logs spidertrap` or `spidertrap.log`.
      render: shell
